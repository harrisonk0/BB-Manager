name: CI Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_staging_checks:
        description: 'Run authenticated checks and sentinel writes against explicitly configured synthetic staging only'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Automatic checks never receive real backend credentials, even on same-repository PRs.
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: synthetic-public-key-not-a-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type-check app and tests
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:run
      - name: Build production bundle
        run: npm run build

  staging-contracts:
    # Existing sentinel flows INSERT/UPDATE/DELETE their fixtures. They must never
    # run merely because production credentials happen to exist on a PR runner.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_staging_checks == true && vars.E2E_TARGET_ENVIRONMENT == 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      VITE_SUPABASE_URL: ${{ secrets.E2E_STAGING_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_STAGING_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_STAGING_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_STAGING_TEST_PASSWORD }}
      E2E_ALLOW_PRODUCTION_MUTATION: '0'
      E2E_MEMBER_PREFIX: ZZZ-E2E-STAGING-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify explicit staging target before any authenticated operation
        env:
          ALLOWED_STAGING_URL: ${{ vars.E2E_STAGING_SUPABASE_URL }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          const required = ['VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY', 'E2E_TEST_EMAIL', 'E2E_TEST_PASSWORD', 'ALLOWED_STAGING_URL', 'PRODUCTION_SUPABASE_URL'];
          for (const name of required) {
            if (!process.env[name]?.trim()) throw new Error(`Staging preflight requires ${name}; no authenticated checks were started.`);
          }
          const normalize = value => {
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash || url.pathname !== '/') {
              throw new Error('Staging/production target must be an HTTPS origin; no authenticated checks were started.');
            }
            return url.origin;
          };
          const target = normalize(process.env.VITE_SUPABASE_URL);
          if (target !== normalize(process.env.ALLOWED_STAGING_URL) || target === normalize(process.env.PRODUCTION_SUPABASE_URL)) {
            throw new Error('Staging target is not explicitly allowlisted or matches production; no authenticated checks were started.');
          }
          console.log('Dedicated staging target accepted. Production-mutating smoke tests remain disabled.');
          NODE
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build staging bundle
        run: npm run build
      - name: Check staging Auth and database contract
        run: |
          npm run check:auth-config
          npm run check:db-contract
      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run isolated staging sentinel browser tests
        run: npm run test:e2e -- tests/e2e/isolated-app-flows.e2e.ts
